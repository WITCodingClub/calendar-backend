<!DOCTYPE html>
<!--
  The week grid MCP App (McpTools::WeekGridApp, docs/mcp.md "Apps").
  The host shows this page in a sandboxed iframe and sends it the tool result
  over postMessage (JSON-RPC 2.0). The page must not load anything from the
  network: the host CSP blocks it. Keep all CSS and JavaScript inline.
  McpTools::AppResource puts the shared files in place of the @include lines.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Week grid</title>
    <style>
      /* @include shared/base.css */

      /* The host draws the card border (prefersBorder), so the grid has only
         faint inner lines. */
      .grid {
        display: grid;
        grid-template-columns: 44px repeat(var(--days), minmax(0, 1fr));
      }

      .day-head {
        padding: 0 0 8px;
        text-align: center;
        font-size: var(--font-text-xs-size);
        font-weight: var(--font-weight-medium);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--color-text-secondary);
        border-bottom: 1px solid var(--color-border-secondary);
      }

      .corner {
        border-bottom: 1px solid var(--color-border-secondary);
      }

      .hours,
      .day {
        position: relative;
        height: calc(var(--hours) * var(--hour-height));
      }

      .day {
        border-left: 1px solid var(--color-border-secondary);
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0 calc(var(--hour-height) - 1px),
          var(--color-border-secondary) calc(var(--hour-height) - 1px) var(--hour-height)
        );
      }

      .hour {
        position: absolute;
        right: 8px;
        font-size: 10px;
        color: var(--color-text-tertiary);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        transform: translateY(-50%);
      }

      .hour.top {
        transform: none;
      }

      .block {
        position: absolute;
        overflow: hidden;
        padding: 4px 6px 4px 10px;
        border-radius: 6px;
        background: var(--block-background);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--block-accent) 18%, transparent);
        color: var(--block-text);
        font-size: var(--font-text-xs-size);
        line-height: 1.3;
      }

      /* The accent bar on the left of each block. */
      .block::before {
        content: "";
        position: absolute;
        top: 3px;
        bottom: 3px;
        left: 3px;
        width: 3px;
        border-radius: 2px;
        background: var(--block-accent);
      }

      .block strong {
        display: block;
        font-weight: var(--font-weight-semibold);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .block.narrow strong {
        white-space: normal;
        overflow-wrap: anywhere;
        text-overflow: clip;
      }

      .block span {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .block .time {
        opacity: 0.8;
        font-variant-numeric: tabular-nums;
      }

      /* The title wraps to the lines that the block has room for. */
      .block .detail {
        display: -webkit-box;
        margin-top: 2px;
        white-space: normal;
        opacity: 0.8;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: var(--detail-lines, 1);
      }

      .block.conflict {
        --block-accent: var(--color-border-danger);
        background: var(--color-background-danger);
        box-shadow: inset 0 0 0 1.5px var(--color-border-danger);
        color: var(--color-text-danger);
      }

      .block .badge {
        font-weight: var(--font-weight-semibold);
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Week grid</h1>
      <p id="summary" class="summary"></p>
    </header>
    <main id="app">
      <p id="status" class="status" role="status">Waiting for the schedule.</p>
    </main>
    <script>
      // @include shared/app.js

      (function () {
        "use strict";

        var DAYS = App.DAYS;
        var DAY_LABELS = App.DAY_LABELS;
        var DAY_NAMES = App.DAY_NAMES;
        var minutes = App.minutes;
        var shortClock = App.shortClock;
        var clock = App.clock;
        var range = App.range;
        var colorPicker = App.colorPicker;
        var el = App.el;
        // Pixels per hour, and the pixel height of one text line in a block
        // (11px * 1.3). buildGrid uses them to fit the title in a block.
        var HOUR_HEIGHT = 60;
        var LINE_HEIGHT = 14.3;

        // check_schedule: { term, sections, conflicts, link_problems, ... }
        // "09:00-10:15" to "9:00 AM to 10:15 AM".
        function span(times) {
          var parts = String(times).split("-");
          var start = minutes(parts[0]);
          var end = minutes(parts[1]);
          return start === null || end === null ? String(times) : clock(start) + " to " + clock(end);
        }

        function fromScheduleCheck(data) {
          // conflict.times[i] is "HH:MM-HH:MM" for conflict.crns[i]. The key holds
          // the times too, so a second meeting of the same CRN on that day is
          // not marked.
          var conflictKeys = {};
          (data.conflicts || []).forEach(function (conflict) {
            (conflict.crns || []).forEach(function (crn, i) {
              conflictKeys[crn + "|" + conflict.day + "|" + (conflict.times || [])[i]] = true;
            });
          });

          var events = [];
          var unscheduled = [];
          var colorOf = colorPicker();
          (data.sections || []).forEach(function (section) {
            var times = section.meeting_times || [];
            if (times.length === 0) unscheduled.push(section.course_code + " (" + section.crn + ")");
            times.forEach(function (time) {
              events.push({
                day: time.day,
                start: minutes(time.begin_time),
                end: minutes(time.end_time),
                label: section.course_code,
                detail: section.title,
                color: colorOf(section.course_code),
                conflict: !!conflictKeys[section.crn + "|" + time.day + "|" + time.begin_time + "-" + time.end_time],
                crn: section.crn
              });
            });
          });

          var notes = [];
          (data.conflicts || []).forEach(function (conflict) {
            notes.push({
              kind: "danger",
              text: "Conflict on " + (DAY_NAMES[conflict.day] || conflict.day) + ": CRN " +
                (conflict.crns || []).join(" and CRN ") + " (" + (conflict.times || []).map(span).join(", ") + ")."
            });
          });
          (data.link_problems || []).forEach(function (problem) { notes.push({ kind: "warning", text: problem.message }); });
          (data.duplicates || []).forEach(function (duplicate) {
            notes.push({ kind: "warning", text: duplicate.course_code + " is in the list more than once: CRN " + duplicate.crns.join(", ") + "." });
          });
          (data.not_found || []).forEach(function (crn) { notes.push({ kind: "warning", text: "No section has CRN " + crn + "." }); });
          (data.cancelled || []).forEach(function (crn) { notes.push({ kind: "warning", text: "CRN " + crn + " is cancelled." }); });
          if (unscheduled.length) notes.push({ kind: "plain", text: "No set meeting time: " + unscheduled.join(", ") + "." });

          var totals = data.totals || {};
          var summary = [];
          if (totals.credit_hours !== undefined) summary.push(totals.credit_hours + " credits");
          if (totals.days) summary.push(totals.days.length + (totals.days.length === 1 ? " day" : " days"));
          var earliest = minutes(totals.earliest_start);
          var latest = minutes(totals.latest_end);
          if (earliest !== null && latest !== null) summary.push(clock(earliest) + " to " + clock(latest));
          if (totals.meetings_before_nine) summary.push(totals.meetings_before_nine + " before 9 AM");
          var conflicts = (data.conflicts || []).length;
          summary.push(conflicts === 0 ? "no conflicts" : conflicts + (conflicts === 1 ? " conflict" : " conflicts"));

          return {
            title: data.term && data.term.name ? "Schedule check, " + data.term.name : "Schedule check",
            summary: summary.join(" · "),
            events: events,
            notes: notes
          };
        }

        // my_courses: { term_uid, courses: [{ prefix, course_number, meeting_times: [{ monday: true, ... }] }] }
        function fromMyCourses(data) {
          var events = [];
          var unscheduled = [];
          var colorOf = colorPicker();
          (data.courses || []).forEach(function (course) {
            var code = [course.prefix, course.course_number].filter(Boolean).join(" ") || course.title;
            var times = course.meeting_times || [];
            var placed = false;
            times.forEach(function (time) {
              // 12:01 to 23:59 is the all-day placeholder of a section with no
              // set time (Course::MeetingTime#all_day?). check_schedule drops it.
              if (time.begin_time === "12:01" && time.end_time === "23:59") return;
              var room = time.location && time.location.building
                ? [time.location.building.abbreviation].concat(time.location.rooms || []).join(" ")
                : "";
              DAYS.forEach(function (day) {
                if (!time[day]) return;
                placed = true;
                events.push({
                  day: day,
                  start: minutes(time.begin_time),
                  end: minutes(time.end_time),
                  label: code,
                  detail: room || course.title,
                  color: colorOf(code),
                  conflict: false
                });
              });
            });
            if (!placed) unscheduled.push(code);
          });

          var notes = [];
          if (unscheduled.length) notes.push({ kind: "plain", text: "No set meeting time: " + unscheduled.join(", ") + "." });
          var count = (data.courses || []).length;

          return {
            title: data.term_name ? "My courses, " + data.term_name : (data.term_uid ? "My courses, term " + data.term_uid : "My courses"),
            summary: count + (count === 1 ? " course" : " courses"),
            events: events,
            notes: notes
          };
        }

        // --- Rendering -------------------------------------------------------

        // Places the events of one day in columns, so blocks that overlap sit
        // side by side.
        function layoutDay(events) {
          events.sort(function (a, b) { return a.start - b.start || b.end - a.end; });
          var groups = [];
          var group = null;
          var groupEnd = -1;
          events.forEach(function (event) {
            if (!group || event.start >= groupEnd) {
              group = [];
              groups.push(group);
              groupEnd = event.end;
            } else {
              groupEnd = Math.max(groupEnd, event.end);
            }
            group.push(event);
          });
          groups.forEach(function (members) {
            var columnEnds = [];
            members.forEach(function (event) {
              var column = columnEnds.findIndex(function (end) { return end <= event.start; });
              if (column === -1) {
                column = columnEnds.length;
                columnEnds.push(event.end);
              } else {
                columnEnds[column] = event.end;
              }
              event.column = column;
            });
            members.forEach(function (event) { event.columns = columnEnds.length; });
          });
        }

        function buildGrid(events) {
          var days = DAYS.filter(function (day, index) {
            return index < 5 || events.some(function (event) { return event.day === day; });
          });
          var first = Math.floor(Math.min.apply(null, events.map(function (e) { return e.start; })) / 60);
          var last = Math.ceil(Math.max.apply(null, events.map(function (e) { return e.end; })) / 60);
          if (last - first < 4) last = first + 4;
          var origin = first * 60;

          var grid = el("div", "grid");
          grid.style.setProperty("--days", days.length);
          grid.style.setProperty("--hours", last - first);
          grid.style.setProperty("--hour-height", HOUR_HEIGHT + "px");

          grid.appendChild(el("div", "corner"));
          days.forEach(function (day) { grid.appendChild(el("div", "day-head", DAY_LABELS[day])); });

          var hours = el("div", "hours");
          hours.setAttribute("aria-hidden", "true");
          for (var hour = first; hour < last; hour++) {
            // The label of the first hour sits at the top line, so it does not
            // move up out of the grid.
            var label = el("span", hour === first ? "hour top" : "hour", clock(hour * 60, true));
            label.style.top = "calc(" + (hour - first) + " * var(--hour-height))";
            hours.appendChild(label);
          }
          grid.appendChild(hours);

          days.forEach(function (day) {
            var column = el("div", "day");
            column.setAttribute("role", "list");
            column.setAttribute("aria-label", DAY_NAMES[day]);
            column.setAttribute("data-day", day);

            var dayEvents = events.filter(function (event) { return event.day === day; });
            layoutDay(dayEvents);

            dayEvents.forEach(function (event) {
              var block = el("div", "block c" + event.color + (event.conflict ? " conflict" : ""));
              block.setAttribute("role", "listitem");
              if (event.crn !== undefined) block.setAttribute("data-crn", event.crn);
              block.style.top = "calc(" + (event.start - origin) + " / 60 * var(--hour-height))";
              block.style.height = "calc(" + (event.end - event.start) + " / 60 * var(--hour-height) - 2px)";
              block.style.left = "calc(" + (event.column / event.columns * 100) + "% + 2px)";
              block.style.width = "calc(" + (100 / event.columns) + "% - 4px)";
              // The badge goes first, so a short block still shows it.
              if (event.conflict) block.appendChild(el("span", "badge", "Conflict"));
              block.appendChild(el("strong", null, event.label));
              if (event.columns > 1) {
                // Blocks that share a column are narrow: the code wraps and the
                // time is short. A block that crosses noon says PM at the end.
                block.classList.add("narrow");
                var crossesNoon = event.start < 720 && event.end > 720;
                block.appendChild(el("span", "time",
                  shortClock(event.start) + "–" + shortClock(event.end) + (crossesNoon ? " PM" : "")));
              } else {
                block.appendChild(el("span", "time", range(event.start, event.end)));
              }
              // The detail stays in narrow blocks too: touch hosts have no
              // tooltip, and a screen reader reads the clipped text. In a wide
              // block it wraps to the lines left under the code and the time.
              if (event.detail) {
                var detail = el("span", "detail", event.detail);
                var height = (event.end - event.start) / 60 * HOUR_HEIGHT - 2 - 8 - 2;
                // The code takes two lines in a narrow block, where it wraps.
                var used = (event.columns > 1 ? 3 : 2) + (event.conflict ? 1 : 0);
                var lines = Math.floor(height / LINE_HEIGHT) - used;
                if (lines < 1) detail.classList.add("visually-hidden");
                else detail.style.setProperty("--detail-lines", lines);
                block.appendChild(detail);
              }
              block.title = event.label + ", " + DAY_NAMES[day] + " " + clock(event.start) + " to " + clock(event.end) +
                (event.detail ? ", " + event.detail : "") + (event.conflict ? ", conflict" : "");
              column.appendChild(block);
            });

            grid.appendChild(column);
          });

          return grid;
        }

        function render(data) {
          var view = data.sections ? fromScheduleCheck(data) : fromMyCourses(data);
          App.setHeader(view.title, view.summary);
          var app = App.clear();

          var events = view.events.filter(function (event) {
            return DAYS.indexOf(event.day) !== -1 && event.start !== null && event.end !== null && event.end > event.start;
          });

          if (events.length === 0) {
            app.appendChild(el("p", "status", "No class meets at a set time."));
          } else {
            app.appendChild(buildGrid(events));
          }

          if (view.notes.length) {
            var list = el("ul", "notes");
            list.setAttribute("aria-label", "Notes");
            view.notes.forEach(function (note) { list.appendChild(el("li", note.kind, note.text)); });
            app.appendChild(list);
          }

          App.append(app, App.advisory(data, data.term ? data.term.uid : data.term_uid));
        }

        App.start({ name: "wit-calendar-week-grid", render: render });
      })();
    </script>
  </body>
</html>
