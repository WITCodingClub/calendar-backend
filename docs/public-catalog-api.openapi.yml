# OpenAPI description of the public catalog REST API.
#
# DocsController serves this file as JSON at /docs/api/openapi.json and
# replaces the server URL with the one for the request host. The prose reference is
# docs/public-catalog-api.md. Change both files together.
openapi: 3.1.0
info:
  title: WIT Calendar Course Catalog API
  version: "1.0.0"
  summary: Read-only course schedule data for Wentworth Institute of Technology.
  description: |
    A public, read-only API for the WIT course schedule. It needs no
    authentication and no API key.

    The API contains course schedule data only. It contains no student data.

    Responses are public and cacheable for 1 hour. The rate limit is 300
    requests per minute per IP address. Every response sends the
    `RateLimit-Policy` and `RateLimit` headers from the IETF draft "RateLimit
    header fields for HTTP", so a client can slow down before it reaches the
    limit. A 429 response also sends `Retry-After`. The same data is also
    available through GraphQL at `POST /api/v1/graphql` and as CSV at
    `/reports/...`.

    Every 4xx and 5xx response has the `Error` body. Branch on its `code`.

    Versioning: the major version is in the path (`/api/v1`). Version 1 only
    gets changes that do not break a client, such as a new field, a new
    endpoint, or a new filter. Before an endpoint or a field is removed, its
    responses send a `Deprecation` header (RFC 9745) and a `Sunset` header
    (RFC 8594). The removal comes at least 90 days after the first
    `Deprecation` header. No endpoint is deprecated now.
externalDocs:
  description: Course Catalog API reference
  url: /docs/api
servers:
  - url: https://calendar.witcc.dev
# The API needs no authentication.
security: []
tags:
  - name: terms
    description: Academic terms
  - name: subjects
    description: Subjects with section counts
  - name: sections
    description: Course sections, one for each CRN
  - name: instructors
    description: Faculty who teach at least one section
  - name: reviews
    description: Rate My Professors reviews of WIT instructors
  - name: courses
    description: Courses across terms, with Banner's description and prerequisites
  - name: programs
    description: Degree programs from the academic catalog, for each catalog year

paths:
  /api/v1/catalog/terms:
    get:
      tags: [terms]
      operationId: listTerms
      summary: List all terms, newest first
      description: Start here to get a `term_uid`.
      parameters:
        - name: active
          in: query
          required: false
          description: With `true`, list only the terms that are in session today.
          schema: { type: boolean }
      responses:
        "200":
          description: Every term
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Term" }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/terms/current:
    get:
      tags: [terms]
      operationId: getCurrentTerm
      summary: Get the current term
      responses:
        "200":
          description: The term
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Term" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/terms/next:
    get:
      tags: [terms]
      operationId: getNextTerm
      summary: Get the term after the current term
      responses:
        "200":
          description: The term
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Term" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/terms/{uid}:
    get:
      tags: [terms]
      operationId: getTerm
      summary: Get one term by its Banner code
      parameters:
        - name: uid
          in: path
          required: true
          description: The Banner term code, for example `202710`.
          schema: { type: integer, examples: [202710] }
      responses:
        "200":
          description: The term
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Term" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/subjects:
    get:
      tags: [subjects]
      operationId: listSubjects
      summary: List subjects with section counts
      parameters:
        - $ref: "#/components/parameters/TermUid"
      responses:
        "200":
          description: Subjects, sorted by name
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Subject" }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
                      term_uid: { type: [integer, "null"] }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/schedule_check:
    get:
      tags: [sections]
      operationId: checkSchedule
      summary: Check a set of sections taken together
      description: >-
        Time conflicts (same day, overlapping times and dates), linked lecture and
        lab pairs from Banner, the same course twice, and totals for the week.
      parameters:
        - name: term_uid
          in: query
          required: true
          schema: { type: integer }
        - name: crn
          in: query
          required: true
          description: Comma-separated CRNs, at most 30, including labs.
          schema: { type: string }
      responses:
        "200":
          description: The check
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      term: { type: object }
                      sections: { type: array, items: { type: object } }
                      not_found: { type: array, items: { type: integer } }
                      cancelled: { type: array, items: { type: integer } }
                      conflicts:
                        type: array
                        items:
                          type: object
                          properties:
                            crns: { type: array, items: { type: integer } }
                            day: { type: string }
                            times: { type: array, items: { type: string } }
                      link_problems:
                        type: array
                        items:
                          type: object
                          properties:
                            crn: { type: integer }
                            problem: { type: string, enum: [missing_partner, unverified_link] }
                            message: { type: string }
                            source: { type: string, enum: [banner, link_identifier] }
                            partner_crns: { type: array, items: { type: integer } }
                            partner_options: { type: array, items: { type: array, items: { type: integer } } }
                      duplicates:
                        type: array
                        items:
                          type: object
                          properties:
                            course_code: { type: string }
                            crns: { type: array, items: { type: integer } }
                      totals:
                        type: object
                        properties:
                          credit_hours: { type: integer }
                          days: { type: array, items: { type: string } }
                          earliest_start: { type: [string, "null"] }
                          latest_end: { type: [string, "null"] }
                          meetings_before_nine: { type: integer }
        "400": { $ref: "#/components/responses/InvalidFilter" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/sections:
    get:
      tags: [sections]
      operationId: listSections
      summary: List course sections, with filters
      description: |
        All filters are optional. `free_days`, `begins_after`, and
        `ends_before` apply to the whole section: a section is dropped if any
        of its meetings breaks the rule. An unknown filter value returns
        HTTP 400. An unknown query parameter is ignored.
      parameters:
        - $ref: "#/components/parameters/TermUid"
        - name: subject
          in: query
          description: Match the subject code or the full label, for example `COMP`.
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: course_number
          in: query
          description: Keep these course numbers.
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: crn
          in: query
          description: Keep these CRNs.
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: pub_id
          in: query
          description: Keep these sections by public id. A value that does not decode returns HTTP 400.
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: q
          in: query
          description: Search the title, subject, and course number.
          schema: { type: string }
        - name: semantic
          in: query
          description: >-
            Rank `q` by meaning instead of by the literal words. Results come
            back nearest first. Falls back to the literal match when semantic
            search is off.
          schema: { type: boolean, default: false }
        - name: schedule_type
          in: query
          description: Keep these schedule types, by name or by code, for example `lecture` or `LEC`.
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: credit_hours
          in: query
          description: Keep these credit hours.
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: instructor
          in: query
          description: Match the instructor name.
          schema: { type: string }
        - name: meets_on
          in: query
          description: Keep sections that meet on any of these days.
          style: form
          explode: false
          schema: { type: array, items: { $ref: "#/components/schemas/Day" } }
        - name: free_days
          in: query
          description: Drop sections that meet on any of these days.
          style: form
          explode: false
          schema: { type: array, items: { $ref: "#/components/schemas/Day" } }
        - name: begins_after
          in: query
          description: Drop sections with any meeting before this time. Use `HH:MM` or `HHMM`. Inclusive.
          schema: { type: string, examples: ["10:00"] }
        - name: ends_before
          in: query
          description: Drop sections with any meeting after this time. Use `HH:MM` or `HHMM`. Inclusive.
          schema: { type: string, examples: ["16:00"] }
        - name: include_cancelled
          in: query
          description: Add cancelled sections.
          schema: { type: boolean }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of sections
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Section" }
                  meta:
                    allOf:
                      - $ref: "#/components/schemas/PageMeta"
                      - type: object
                        properties:
                          filters:
                            type: object
                            description: The filters that the request applied.
                            additionalProperties: true
        "400": { $ref: "#/components/responses/InvalidFilter" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/sections/{crn}:
    get:
      tags: [sections]
      operationId: getSection
      summary: Get one section by CRN
      description: |
        This endpoint also returns cancelled sections. A CRN is only unique
        inside one term, so send `term_uid` when a CRN occurs in more than one
        term.
      parameters:
        - name: crn
          in: path
          required: true
          schema: { type: integer, examples: [17294] }
        - $ref: "#/components/parameters/TermUid"
      responses:
        "200":
          description: The section
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Section" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/sections/{crn}/similar:
    get:
      tags: [sections]
      operationId: listSimilarSections
      summary: List sections that teach something close to this one
      description: |
        Ranked by meaning, nearest first. Results stay inside the section's own
        term, and the other sections of the same course are left out. The list
        is empty until the section has been embedded, which happens nightly.
      parameters:
        - name: crn
          in: path
          required: true
          schema: { type: integer, examples: [17294] }
        - $ref: "#/components/parameters/TermUid"
        - $ref: "#/components/parameters/SimilarLimit"
      responses:
        "200":
          description: Sections like this one, nearest first
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Section" }
                  meta:
                    type: object
                    properties:
                      crn: { type: integer }
                      limit: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/instructors:
    get:
      tags: [instructors]
      operationId: listInstructors
      summary: List faculty who teach at least one section
      parameters:
        - $ref: "#/components/parameters/TermUid"
        - name: q
          in: query
          description: Each word must match the first, last, or display name.
          schema: { type: string }
        - name: semantic
          in: query
          description: >-
            Rank `q` by meaning instead of by the literal name. Falls back to
            the literal match when semantic search is off.
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of instructors, sorted by last name
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Instructor" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/instructors/{pub_id}:
    get:
      tags: [instructors]
      operationId: getInstructor
      summary: Get one instructor by public id, with Rate My Professors details
      parameters:
        - name: pub_id
          in: path
          required: true
          schema: { type: string }
        - name: term_uid
          in: query
          description: Also list the sections the instructor teaches in this term.
          schema: { type: integer }
      responses:
        "200":
          description: The instructor
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/InstructorDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/instructors/{pub_id}/similar:
    get:
      tags: [instructors]
      operationId: listSimilarInstructors
      summary: List instructors who teach something close to what this one teaches
      description: |
        Ranked by meaning, nearest first. The list is empty until the
        instructor has been embedded, which happens nightly.
      parameters:
        - name: pub_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/SimilarLimit"
      responses:
        "200":
          description: Instructors like this one, nearest first
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Instructor" }
                  meta:
                    type: object
                    properties:
                      pub_id: { type: string }
                      limit: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/courses:
    get:
      tags: [courses]
      operationId: listCourses
      summary: Search courses (not sections) by code or title words
      parameters:
        - name: q
          in: query
          description: A course code such as "COMP 2350", or words in the title.
          schema: { type: string }
        - name: subject
          in: query
          description: Subject codes, comma-separated.
          schema: { type: string, examples: ["COMP,MATH"] }
        - $ref: "#/components/parameters/TermUid"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of courses, by subject and number
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CourseSummary" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/courses/{code}:
    get:
      tags: [courses]
      operationId: getCourse
      summary: Get one course with its description, prerequisites, and what it unlocks
      parameters:
        - name: code
          in: path
          required: true
          description: The course code, such as COMP2350 or "COMP 2350".
          schema: { type: string }
        - name: term_uid
          in: query
          description: Also list the course's sections in this term.
          schema: { type: integer }
      responses:
        "200":
          description: The course
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Course" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/programs:
    get:
      tags: [programs]
      operationId: listPrograms
      summary: List the degree programs of one catalog year
      parameters:
        - $ref: "#/components/parameters/CatalogYear"
        - name: kind
          in: query
          description: Only programs of these kinds, comma-separated.
          schema:
            type: string
            examples: ["bachelor,minor"]
        - name: level
          in: query
          description: Only programs of these levels, comma-separated (undergraduate, graduate).
          schema:
            type: string
            examples: ["undergraduate"]
        - name: q
          in: query
          description: Words in the program name.
          schema: { type: string }
      responses:
        "200":
          description: The programs, by name
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ProgramSummary" }
                  meta:
                    type: object
                    required: [count, catalog_year, catalog_years]
                    properties:
                      count: { type: integer }
                      catalog_year: { type: string, examples: ["2024-2025"] }
                      catalog_years:
                        description: The catalog years the API has, newest first.
                        type: array
                        items: { type: string }
        "400": { $ref: "#/components/responses/InvalidFilter" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/programs/{slug}:
    get:
      tags: [programs]
      operationId: getProgram
      summary: Get one program with its plans of study and elective lists
      parameters:
        - name: slug
          in: path
          required: true
          description: The program slug from the list, such as computer-science-bs, or the exact program name.
          schema: { type: string }
        - $ref: "#/components/parameters/CatalogYear"
      responses:
        "200":
          description: The program in that catalog year
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Program" }
        "400": { $ref: "#/components/responses/InvalidFilter" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/catalog/reviews:
    get:
      tags: [reviews]
      operationId: listReviews
      summary: List Rate My Professors reviews
      description: |
        Reviews of WIT instructors, newest first. Only reviews that carry a
        comment are returned. The text belongs to the student who wrote it on
        ratemyprofessors.com, and every payload names that source.

        `semantic=true` ranks by meaning, so "lots of group projects" finds the
        reviews that say so in other words.
      parameters:
        - name: instructor
          in: query
          description: Keep the reviews of one instructor, by public id.
          schema: { type: string }
        - name: q
          in: query
          description: Search the comment and the course name.
          schema: { type: string }
        - name: semantic
          in: query
          description: >-
            Rank `q` by meaning instead of by the literal words. Falls back to
            the literal match when semantic search is off.
          schema: { type: boolean, default: false }
        - name: sentiment
          in: query
          description: Keep only positive or only negative reviews.
          schema: { type: string, enum: [positive, negative] }
        - $ref: "#/components/parameters/Page"
        - name: per_page
          in: query
          description: Reviews per page, 1 to 100.
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: One page of reviews
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Review" }
                  meta:
                    allOf:
                      - $ref: "#/components/schemas/PageMeta"
                      - type: object
                        properties:
                          source:
                            type: string
                            description: Where the review text comes from.
                          filters:
                            type: object
                            description: The filters that the request applied.
                            additionalProperties: true
        "400": { $ref: "#/components/responses/InvalidFilter" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  parameters:
    CatalogYear:
      name: catalog_year
      in: query
      description: >-
        The catalog year, such as 2024-2025, 2024-25, or 2024 (the first year). A term name such as
        "Spring 2024" gives the catalog year of that term; a catalog year starts in the fall, so Spring 2024
        is in 2023-2024. Leave it out for the newest catalog year.
      schema: { type: string, examples: ["2024-2025"] }
    SimilarLimit:
      name: limit
      in: query
      description: How many neighbours to return, 1 to 50.
      schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
    TermUid:
      name: term_uid
      in: query
      description: Keep results in this term, by Banner term code.
      schema: { type: integer, examples: [202710] }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  headers:
    RateLimit:
      description: |
        The quota that is left under each policy. `r` is the number of requests
        left, and `t` is the number of seconds until the window resets.
      schema: { type: string, examples: ['"req/ip";r=599;t=180, "catalog/ip";r=299;t=42'] }
    RateLimitPolicy:
      description: |
        The quota policies that apply to the request. `q` is the number of
        requests allowed in a window of `w` seconds.
      schema: { type: string, examples: ['"req/ip";q=600;w=300, "catalog/ip";q=300;w=60'] }
    RetryAfter:
      description: The number of seconds to wait before the next request.
      schema: { type: integer, examples: [60] }

  responses:
    InvalidFilter:
      description: A filter value is not valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: The client used all of a quota. Wait for the number of seconds in Retry-After.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit: { $ref: "#/components/headers/RateLimit" }
        RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No record matches
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: An unexpected server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      description: The body of every 4xx and 5xx response.
      required: [error, code]
      properties:
        error: { type: string, description: A message for a person. }
        code:
          type: string
          description: A stable, machine-readable code. Branch on this, not on `error`.
          enum: [INVALID_FILTER, NOT_FOUND, RATE_LIMITED, INTERNAL_ERROR]
        message: { type: string, description: More detail. Only RATE_LIMITED sends it. }
        retry_after: { type: integer, description: Seconds to wait. Only RATE_LIMITED sends it. }

    PageMeta:
      type: object
      required: [page, per_page, total_count, total_pages]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total_count: { type: integer }
        total_pages: { type: integer }

    Day:
      type: string
      enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]

    Term:
      type: object
      required: [uid, name]
      properties:
        uid: { type: integer, description: The Banner term code. }
        name: { type: string, examples: ["Fall 2026"] }
        season: { type: string, examples: [fall] }
        year: { type: integer }
        start_date: { type: [string, "null"], format: date }
        end_date: { type: [string, "null"], format: date }
        section_count: { type: integer, description: The number of active sections. }

    Subject:
      type: object
      required: [subject, code, section_count]
      properties:
        subject: { type: string, examples: ["Computer Science (COMP)"] }
        code: { type: string, examples: [COMP] }
        section_count: { type: integer }

    Section:
      type: object
      required: [crn, pub_id, term, subject, course_number, section_number, title, status]
      properties:
        crn: { type: integer, description: Unique only inside one term. }
        pub_id:
          type: string
          description: Unique across every term and never changes. Use it as the key to store.
        term:
          type: object
          properties:
            uid: { type: integer }
            name: { type: string }
        subject: { type: string }
        subject_code: { type: [string, "null"] }
        course_number: { type: integer }
        section_number: { type: string }
        course_code: { type: string, examples: ["COMP 1000-01"] }
        title: { type: string }
        schedule_type: { type: string, examples: [lecture] }
        schedule_type_code: { type: [string, "null"], examples: [LEC] }
        credit_hours: { type: [integer, "null"] }
        grade_mode: { type: [string, "null"] }
        status: { type: string, enum: [active, cancelled] }
        seats:
          type: object
          description: From Banner, refreshed every night, and every 30 minutes from the time a term's sections are listed until 7 days after its classes start. Not a real-time seat count.
          properties:
            capacity: { type: [integer, "null"] }
            available: { type: [integer, "null"] }
        waitlist:
          type: object
          description: The waitlist places and the places still open, from the same Banner data and jobs as seats. A section with no waitlist has a capacity of 0.
          properties:
            capacity: { type: [integer, "null"] }
            available: { type: [integer, "null"] }
        linked:
          type: object
          description: The sections that a student must register together, most often a lecture and its lab.
          properties:
            required: { type: boolean }
            identifier: { type: [string, "null"] }
            source:
              type: string
              enum: [banner, link_identifier]
              description: >-
                banner is Banner's own pairs. link_identifier is a guess from the
                link identifiers, used until Banner's pairs are fetched. The guess can be wrong.
            crns: { type: array, items: { type: integer } }
            pub_ids: { type: array, items: { type: string } }
            options:
              type: array
              description: Each list is one set of partner CRNs to take together. Pick any one set.
              items: { type: array, items: { type: integer } }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        instructors:
          type: array
          items: { $ref: "#/components/schemas/Instructor" }
        meeting_times:
          type: array
          items: { $ref: "#/components/schemas/MeetingTime" }
        final_exam:
          oneOf:
            - $ref: "#/components/schemas/FinalExam"
            - type: "null"

    MeetingTime:
      type: object
      properties:
        day: { $ref: "#/components/schemas/Day" }
        day_of_week: { type: integer, minimum: 0, maximum: 6, description: 0 is Sunday. }
        begin_time: { type: string, examples: ["08:00"] }
        end_time: { type: string, examples: ["09:15"] }
        begin_time_12h: { type: string }
        end_time_12h: { type: string }
        duration_minutes: { type: integer }
        meeting_type: { type: [string, "null"] }
        all_day: { type: boolean }
        location:
          description: Null when the section has no room, as with online sections.
          oneOf:
            - $ref: "#/components/schemas/Location"
            - type: "null"

    Location:
      type: object
      properties:
        display:
          type: [string, "null"]
          description: Null when the room is a placeholder "TBD" record.
        building:
          type: object
          properties:
            abbreviation: { type: [string, "null"] }
            name: { type: [string, "null"] }
        rooms:
          type: array
          items:
            type: object
            properties:
              number: { type: string }
              floor: { type: integer }

    FinalExam:
      type: object
      properties:
        date: { type: string, format: date }
        start_time: { type: [string, "null"] }
        end_time: { type: [string, "null"] }
        location: { type: [string, "null"] }

    Instructor:
      type: object
      required: [pub_id, name]
      properties:
        pub_id: { type: string }
        name: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        title: { type: [string, "null"] }
        department: { type: [string, "null"] }
        school: { type: [string, "null"] }
        rmp:
          description: Rate My Professors scores. Null when the instructor has no ratings.
          oneOf:
            - $ref: "#/components/schemas/Rmp"
            - type: "null"

    CourseSummary:
      type: object
      required: [code, subject_code, course_number, typically_offered]
      properties:
        code: { type: string, examples: ["COMP 2350"] }
        subject_code: { type: string }
        course_number: { type: integer }
        title: { type: [string, "null"] }
        credit_hours: { type: [integer, "null"] }
        typically_offered:
          type: array
          items: { type: string, enum: [fall, spring, summer] }

    Course:
      allOf:
        - $ref: "#/components/schemas/CourseSummary"
        - type: object
          properties:
            description: { type: [string, "null"] }
            prerequisites:
              description: >-
                An and/or tree. A node is {type: "and"|"or", operands}, {type: "course",
                subject_code, course_number, code, title, linked, min_grade, level}, or
                {type: "test", name, score}. Null when the course has none.
              type: [object, "null"]
            corequisites:
              type: array
              items: { type: object }
            restrictions:
              type: array
              items:
                type: object
                properties:
                  heading: { type: string }
                  values: { type: array, items: { type: string } }
            unlocks:
              type: array
              items: { $ref: "#/components/schemas/CourseSummary" }
            details_term_uid: { type: [integer, "null"] }
            details_fetched_at: { type: [string, "null"], format: date-time }
            sections:
              type: array
              items: { $ref: "#/components/schemas/Section" }

    ProgramSummary:
      type: object
      required: [slug, name, kind, level, catalog_year]
      properties:
        slug: { type: string, examples: ["computer-science-bs"] }
        name: { type: string, examples: ["Computer Science, B.S."] }
        kind:
          type: string
          enum: [associate, bachelor, master, minor, concentration, certificate, exploratory]
        level: { type: string, enum: [undergraduate, graduate] }
        school: { type: [string, "null"] }
        department: { type: [string, "null"] }
        catalog_year: { type: string, examples: ["2024-2025"] }
        total_credits: { type: [integer, "null"] }
        parent_program:
          description: The slug of the major a concentration belongs to.
          type: [string, "null"]
        catalog_url: { type: [string, "null"], format: uri }
        listed:
          description: >-
            False for a program that the newest import of its catalog year no longer found. The list leaves
            these out. The program endpoint still returns them.
          type: boolean

    ProgramCourse:
      type: object
      required: [code]
      properties:
        code: { type: string, examples: ["COMP 2350"] }
        title: { type: [string, "null"] }

    Program:
      allOf:
        - $ref: "#/components/schemas/ProgramSummary"
        - type: object
          properties:
            description: { type: [string, "null"] }
            needs_review:
              description: True for a program read from a PDF catalog that no person has checked yet.
              type: boolean
            source: { type: string, enum: [html, wayback, pdf] }
            plans:
              type: array
              items:
                type: object
                properties:
                  name: { type: string, examples: ["Four Year Program"] }
                  years: { type: integer }
                  accelerated: { type: boolean }
                  total_credits: { type: [integer, "null"] }
                  terms:
                    type: array
                    items:
                      type: object
                      properties:
                        year: { type: integer, description: "The year of the plan, from 1." }
                        season: { type: string, enum: [fall, spring, summer] }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              kind: { type: string, enum: [course, choice, placeholder] }
                              code: { type: [string, "null"] }
                              title: { type: [string, "null"] }
                              min_credits: { type: [integer, "null"] }
                              max_credits: { type: [integer, "null"] }
                              footnote: { type: [string, "null"] }
                              options:
                                type: array
                                items: { $ref: "#/components/schemas/ProgramCourse" }
                              elective_list:
                                description: The name of the elective list a placeholder draws from.
                                type: [string, "null"]
            elective_lists:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  heading: { type: [string, "null"] }
                  plan:
                    description: The plan the list is printed under, or null for the whole program.
                    type: [string, "null"]
                  min_courses: { type: [integer, "null"] }
                  min_credits: { type: [integer, "null"] }
                  notes: { type: [string, "null"] }
                  courses:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ProgramCourse"
                        - type: object
                          properties:
                            requires_approval: { type: boolean }

    InstructorDetail:
      allOf:
        - $ref: "#/components/schemas/Instructor"
        - type: object
          properties:
            rating_distribution:
              description: How many ratings gave each score, 1 to 5. Null with no ratings.
              type: [object, "null"]
            rmp_tags:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  count: { type: integer }
            recent_reviews:
              type: array
              items: { $ref: "#/components/schemas/Review" }
            review_count: { type: integer }
            reviews_source: { type: string }
            sections:
              type: array
              items: { $ref: "#/components/schemas/Section" }

    Review:
      type: object
      required: [pub_id, comment, source]
      properties:
        pub_id: { type: string }
        instructor:
          oneOf:
            - $ref: "#/components/schemas/Instructor"
            - type: "null"
        course_name: { type: [string, "null"] }
        comment: { type: string }
        clarity_rating: { type: [integer, "null"] }
        difficulty_rating: { type: [integer, "null"] }
        would_take_again: { type: [boolean, "null"] }
        sentiment: { type: string, enum: [positive, neutral, negative] }
        tags:
          type: array
          items: { type: string }
        thumbs_up: { type: [integer, "null"] }
        thumbs_down: { type: [integer, "null"] }
        rated_on: { type: [string, "null"], format: date }
        source: { type: string, examples: ["ratemyprofessors.com"] }

    Rmp:
      type: object
      properties:
        id: { type: [string, "null"] }
        avg_rating: { type: [number, "null"] }
        avg_difficulty: { type: [number, "null"] }
        num_ratings: { type: integer }
        would_take_again_percent: { type: [number, "null"] }
