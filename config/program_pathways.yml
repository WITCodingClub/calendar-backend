# The program pathways a student can plan (#868). People keep this list, because
# the catalog has no list of them. DegreeRequirements::PathwaySeed reads it after
# each catalog import, and `bin/rails degree_requirements:pathways` runs it now.
# docs/degree-requirements.md has the rules.
#
# Sources (read 2026-11-06):
# - https://catalog.wit.edu/programs-az/accelerated-programs/ lists the
#   3-year B.S. programs and "Architecture, B.S. and Master of Architecture 5-Year".
# - https://wit.edu/admissions/graduate/accelerated-masters-degrees lists the
#   Double Leopard (4+1) master's programs: "Take up to two courses during your
#   senior year" (max_shared_courses 2). Architecture (the M.Arch) is on that
#   list too, so the 5-year path has the same limit. Neither page gives a
#   credit limit.
#
# A 4+1 or 3+1 here pairs a B.S. with the master's of the same subject. Add a
# pair only when both pages support it.
#
# Each step names a DegreeProgram slug (the last part of its catalog path).
# A pathway that leaves this list is kept with active: false, because planned
# programs can link to it.

- slug: architecture-bs-march-5-year
  name: Architecture, B.S. and Master of Architecture (5-year)
  kind: five_year
  max_shared_courses: 2
  steps:
    - program: architecture-bs
      plan_years: 4
    - program: architecture-masters
      plan_years: 1

