default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  # The worker takes every ready job from high before default, and from
  # default before low. Bulk fan-outs go to low (CourseCalendars::SyncJob::BULK),
  # so they do not hold up mail and the syncs that people start.
  # JOB_THREADS also sizes the database pools (config/database.yml, #677).
  workers:
    - queues: [ high, default, low ]
      threads: <%= Integer(ENV.fetch("JOB_THREADS", 3)) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
