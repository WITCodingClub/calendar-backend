# All times are in the application's configured timezone (EST).
# Jobs run on the 'low' queue unless otherwise noted.

production:
  # ---------------------------------------------------------------------------
  # FREQUENT
  # ---------------------------------------------------------------------------

  pghero_capture_query_stats:
    class: Database::CaptureQueryStatsJob
    queue: low
    schedule: every 5 minutes

  # ---------------------------------------------------------------------------
  # HOURLY
  # ---------------------------------------------------------------------------

  # Finishes friend meetings whose owner deleted them and whose provider
  # events are still there.
  friend_meeting_removal_sweep:
    class: FriendMeetings::RemovalSweepJob
    queue: low
    schedule: every hour at minute 27

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    queue: low
    schedule: every hour at minute 12

  # Failed batches are kept for inspection, like failed jobs.
  clear_solid_queue_finished_batches:
    command: "SolidQueue::Batch.clear_finished_in_batches(sleep_between_batches: 0.3)"
    queue: low
    schedule: every hour at minute 42

  # Expired friendships already grant nothing. This only deletes the rows.
  remove_expired_friendships:
    class: Friendships::RemoveExpiredJob
    queue: low
    schedule: every hour at minute 27

  # Expired friend groups are already hidden. This only deletes the rows. The
  # friendships in them stay.
  remove_expired_friend_groups:
    class: FriendGroups::RemoveExpiredJob
    queue: low
    schedule: every hour at minute 29

  # ---------------------------------------------------------------------------
  # EVERY 6 HOURS
  # ---------------------------------------------------------------------------

  nightly_calendar_sync:
    class: CourseCalendars::NightlySyncJob
    queue: low
    schedule: every 6 hours

  # ---------------------------------------------------------------------------
  # NIGHTLY (3:30am–8am window, staggered 30 min apart)
  # ---------------------------------------------------------------------------

  cleanup_orphaned_google_calendars:
    class: Cleanup::OrphanedGoogleCalendarsJob
    queue: low
    schedule: every day at 4am

  course_data_sync:
    class: Catalog::CourseDataSyncJob
    queue: low
    schedule: every day at 4am

  cleanup_orphaned_oauth_credentials:
    class: Cleanup::OrphanedOauthCredentialsJob
    queue: low
    schedule: every day at 4:30am

  # Embeds the sections the catalog sync just wrote, and any instructor or
  # review text that changed. Text that did not change never reaches the API.
  backfill_embeddings:
    class: Embeddings::BackfillJob
    queue: low
    schedule: every day at 4:45am

  cleanup_orphaned_calendar_events:
    class: Cleanup::OrphanedCalendarEventsJob
    queue: low
    schedule: every day at 5am

  pghero_space_stats:
    class: Database::CaptureSpaceStatsJob
    queue: low
    schedule: every day at 5:30am

  # Query stats are captured every 5 minutes, so the table grows fast. PgHero
  # keeps 14 days of query stats and 90 days of space stats by default.
  pghero_clean_query_stats:
    command: "PgHero.clean_query_stats"
    queue: low
    schedule: every day at 6am

  pghero_clean_space_stats:
    command: "PgHero.clean_space_stats"
    queue: low
    schedule: every day at 6:30am

  # ---------------------------------------------------------------------------
  # WEEKLY
  # ---------------------------------------------------------------------------

  # Wednesday: OAuth maintenance
  refresh_oauth_tokens:
    class: OauthCredentials::RefreshTokensJob
    queue: low
    schedule: every wednesday at 2am

  # Saturday: University data sync
  university_calendar_sync:
    class: UniversityCalendar::SyncJob
    queue: low
    schedule: every saturday at 2am

  # 25Live holds the registrar's own room capacities, and it reports drift in
  # the constants we mirror. Weekly is enough: rooms are rebuilt between terms,
  # not between days.
  twenty_five_live_sync:
    class: TwentyFiveLive::SyncJob
    queue: low
    schedule: every saturday at 2:30am

  # Sunday: RateMyProfessor maintenance (fill IDs first, then update ratings)
  fill_missing_rmp_ids:
    class: Faculties::FillMissingRmpIdsJob
    queue: low
    schedule: every sunday at 2am

  update_faculty_rmp_ratings:
    command: "Faculty.update_all_ratings!"
    queue: low
    schedule: every sunday at 3am

  # ---------------------------------------------------------------------------
  # MONTHLY
  # ---------------------------------------------------------------------------

  ensure_future_terms:
    class: Catalog::EnsureFutureTermsJob
    queue: low
    schedule: every month on the 1st at 2am
