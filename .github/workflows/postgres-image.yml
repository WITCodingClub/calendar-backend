name: Postgres image

# Builds the production Postgres image, which is postgres:17-alpine plus
# pgvector. alastor pulls it by tag, so a change here reaches the server only
# after the image is pushed and the database service restarts.

on:
  push:
    branches: [main]
    paths:
      - docker/postgres/Dockerfile
      - .github/workflows/postgres-image.yml
  pull_request:
    paths:
      - docker/postgres/Dockerfile
      - .github/workflows/postgres-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push
    # alastor is arm64, so the image is built on an arm64 runner.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/postgres
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/witcodingclub/calendar-postgres:17-alpine
            ghcr.io/witcodingclub/calendar-postgres:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check that the extension loads
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm -d --name pgvector-check \
            -e POSTGRES_PASSWORD=check \
            ghcr.io/witcodingclub/calendar-postgres:17-alpine
          for _ in $(seq 1 30); do
            docker exec pgvector-check pg_isready -U postgres && break
            sleep 1
          done
          docker exec pgvector-check psql -U postgres -c "CREATE EXTENSION vector;"
          docker exec pgvector-check psql -U postgres -c "SELECT '[1,2,3]'::vector;"
          docker rm -f pgvector-check
